<div class="content-wrapper">
  <div class="content-header">
    <div class="container-fluid">
      <div class="row mb-2">
        <div class="col-sm-6">
          <h1 class="m-0">Google Drive - Imágenes</h1>
        </div>
        <div class="col-sm-6">
          <ol class="breadcrumb float-sm-right">
            <li class="breadcrumb-item"><a routerLink="/">Inicio</a></li>
            <li class="breadcrumb-item active">Google Drive</li>
          </ol>
        </div>
      </div>
    </div>
  </div>

  <section class="content">
    <div class="container-fluid">
      <!-- Carpetas -->
      <div class="row mb-3">
        <div class="col-12">
          <div class="card">
            <div class="card-header">
              <h3 class="card-title">
                <i class="fas fa-folder mr-2"></i>Carpetas
              </h3>
              <div class="card-tools">
                <button class="btn btn-tool" (click)="openNewFolderModal()">
                  <i class="fas fa-plus"></i> Nueva Carpeta
                </button>
              </div>
            </div>
            <div class="card-body p-2">
              <div class="d-flex flex-wrap gap-2">
                <button
                  class="btn btn-sm"
                  [class.btn-primary]="!selectedFolder"
                  [class.btn-outline-primary]="selectedFolder"
                  (click)="clearFolderFilter()"
                >
                  Todas
                </button>
                <button
                  *ngFor="let folder of folders"
                  class="btn btn-sm"
                  [class.btn-primary]="selectedFolder === folder.id"
                  [class.btn-outline-primary]="selectedFolder !== folder.id"
                  (click)="selectFolder(folder.id)"
                >
                  <i class="fas fa-folder mr-1"></i>{{ folder.name }}
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Acciones -->
      <div class="row mb-3">
        <div class="col-12">
          <button class="btn btn-primary" (click)="openUploadModal()">
            <i class="fas fa-cloud-upload-alt mr-2"></i>Subir Imagen
          </button>
          <button class="btn btn-secondary ml-2" (click)="loadImages()">
            <i class="fas fa-sync mr-2"></i>Actualizar
          </button>
        </div>
      </div>

      <!-- Loading -->
      <div *ngIf="loading" class="text-center py-5">
        <i class="fas fa-spinner fa-spin fa-3x text-primary"></i>
        <p class="mt-3">Cargando imágenes...</p>
      </div>

      <!-- Grid de imágenes -->
      <div *ngIf="!loading && images.length > 0" class="row">
        <div *ngFor="let image of images" class="col-lg-3 col-md-4 col-sm-6 mb-4">
          <div class="card h-100">
            <div class="card-img-top-wrapper" (click)="viewImage(image)">
              <img
                [src]="image.webContentLink"
                [alt]="image.name"
                class="card-img-top"
                loading="lazy"
              />
            </div>
            <div class="card-body p-2">
              <p class="card-text text-truncate small mb-1" [title]="image.name">
                {{ image.name }}
              </p>
              <p class="text-muted small mb-0">
                {{ formatSize(image.size) }} · {{ formatDate(image.createdTime) }}
              </p>
            </div>
            <div class="card-footer bg-transparent p-2">
              <div class="btn-group btn-group-sm w-100">
                <button class="btn btn-outline-primary" (click)="viewImage(image)" title="Ver">
                  <i class="fas fa-eye"></i>
                </button>
                <button class="btn btn-outline-secondary" (click)="copyLink(image)" title="Copiar enlace">
                  <i class="fas fa-link"></i>
                </button>
                <button class="btn btn-outline-danger" (click)="deleteImage(image)" title="Eliminar">
                  <i class="fas fa-trash"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Sin imágenes -->
      <div *ngIf="!loading && images.length === 0" class="text-center py-5">
        <i class="fas fa-images fa-3x text-muted"></i>
        <p class="mt-3 text-muted">No hay imágenes para mostrar</p>
        <button class="btn btn-primary" (click)="openUploadModal()">
          <i class="fas fa-cloud-upload-alt mr-2"></i>Subir primera imagen
        </button>
      </div>
    </div>
  </section>
</div>

<!-- Modal Subir Imagen -->
<div *ngIf="showUploadModal" class="modal d-block" tabindex="-1" style="background-color: rgba(0,0,0,0.5)">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">
          <i class="fas fa-cloud-upload-alt mr-2"></i>Subir Imagen
        </h5>
        <button type="button" class="close" (click)="closeUploadModal()">
          <span>&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Seleccionar imagen</label>
          <div class="custom-file">
            <input
              type="file"
              class="custom-file-input"
              accept="image/*"
              (change)="onFileSelected($event)"
              id="fileInput"
            />
            <label class="custom-file-label" for="fileInput">
              {{ selectedFile ? selectedFile.name : 'Seleccionar archivo...' }}
            </label>
          </div>
        </div>
        <div *ngIf="previewUrl" class="text-center mt-3">
          <img [src]="previewUrl" class="img-fluid rounded" style="max-height: 300px" />
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="closeUploadModal()">Cancelar</button>
        <button
          type="button"
          class="btn btn-primary"
          (click)="uploadImage()"
          [disabled]="!selectedFile || uploading"
        >
          <i *ngIf="uploading" class="fas fa-spinner fa-spin mr-2"></i>
          {{ uploading ? 'Subiendo...' : 'Subir' }}
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Modal Nueva Carpeta -->
<div *ngIf="showNewFolderModal" class="modal d-block" tabindex="-1" style="background-color: rgba(0,0,0,0.5)">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">
          <i class="fas fa-folder-plus mr-2"></i>Nueva Carpeta
        </h5>
        <button type="button" class="close" (click)="closeNewFolderModal()">
          <span>&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Nombre de la carpeta</label>
          <input
            type="text"
            class="form-control"
            [(ngModel)]="newFolderName"
            placeholder="Ej: Productos, Promociones..."
          />
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="closeNewFolderModal()">Cancelar</button>
        <button
          type="button"
          class="btn btn-primary"
          (click)="createFolder()"
          [disabled]="!newFolderName.trim()"
        >
          Crear
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Modal Ver Imagen -->
<div *ngIf="showImageModal && selectedImage" class="modal d-block" tabindex="-1" style="background-color: rgba(0,0,0,0.8)">
  <div class="modal-dialog modal-xl">
    <div class="modal-content bg-transparent border-0">
      <div class="modal-header border-0">
        <h5 class="modal-title text-white">{{ selectedImage.name }}</h5>
        <button type="button" class="close text-white" (click)="closeImageModal()">
          <span>&times;</span>
        </button>
      </div>
      <div class="modal-body text-center">
        <img [src]="selectedImage.webContentLink" class="img-fluid rounded" />
      </div>
      <div class="modal-footer border-0 justify-content-center">
        <button class="btn btn-light mr-2" (click)="copyLink(selectedImage)">
          <i class="fas fa-link mr-2"></i>Copiar enlace
        </button>
        <button class="btn btn-danger" (click)="deleteImage(selectedImage)">
          <i class="fas fa-trash mr-2"></i>Eliminar
        </button>
      </div>
    </div>
  </div>
</div>
